<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4D33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EIE Ouvéa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>EIE Ouvéa – terrain</title>
<style>
:root{--g:#1F4D33;--g2:#2E7D4F;--l:#EEF4EF;--t:#1E2B22;--m:#5A6A60;--r:#B23A2E}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#fff;color:var(--t);font-size:17px;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 0}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:18px}#st{font-size:13px;opacity:.9;text-align:right}
nav.tabs{display:flex;overflow-x:auto;gap:2px;margin-top:6px}
nav.tabs button{flex:1;min-width:72px;background:transparent;color:#cfe3d5;border:0;padding:10px 6px;font-size:15px;font-weight:600;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
main{padding:12px;max-width:760px;margin:0 auto}
.sub,.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.sub button,.seg button{border:1px solid var(--g2);background:#fff;color:var(--g2);border-radius:20px;padding:8px 12px;font-size:15px;font-weight:600}
.sub button.on,.seg button.on{background:var(--g2);color:#fff}
.ctxbar{background:var(--l);border-radius:10px;padding:8px;margin-bottom:10px}
.ctxbar .seg{margin:2px 0}
.ctxbar .seg button{min-width:52px;padding:10px 12px;font-size:17px}
.card{background:#fff;border:1px solid #D5DCD7;border-radius:12px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px;color:var(--g)}
.ctx{font-weight:700;color:var(--g2);margin-bottom:6px}
.row{display:block;margin:10px 0}.row .lab{display:block;font-size:14px;color:var(--m);margin-bottom:4px;font-weight:600}
.row.chk{display:flex;align-items:center;gap:10px}.row.chk input{width:28px;height:28px}.row.chk .lab{margin:0;font-size:16px;color:var(--t)}
input[type=text],input[type=number],select,textarea{width:100%;font-size:17px;padding:11px;border:1px solid #B9C4BC;border-radius:8px;background:#fff;color:var(--t)}
textarea{font-family:inherit}
.codes{display:flex;flex-wrap:wrap;gap:6px}.cb{min-width:44px;height:44px;border:1px solid var(--g2);background:#fff;border-radius:8px;font-size:18px;font-weight:700;color:var(--g2)}.cb.on{background:var(--g2);color:#fff}
.cnt{display:flex;align-items:center;gap:10px}.cnt button{width:52px;height:46px;font-size:24px;border:1px solid var(--g2);border-radius:8px;background:#fff;color:var(--g2);font-weight:700}.cnt button.small{font-size:16px}.cn{min-width:44px;text-align:center;font-size:22px;font-weight:700}
.btn,.btn2,.btn3{border:0;border-radius:10px;padding:13px 16px;font-size:17px;font-weight:700}
.btn{background:var(--g2);color:#fff}.btn2{background:var(--l);color:var(--g);border:1px solid var(--g2)}.btn3{background:#fff;color:var(--r);border:1px solid var(--r)}
.btn.big{width:100%;padding:18px;font-size:19px;margin-bottom:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gpsrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gv{font-size:14px;color:var(--m)}
.ths{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.th{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid #ccc}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:flex;align-items:center;justify-content:center}.zoom img{max-width:100%;max-height:100%}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid #EEE;font-size:15px}.li .who{color:var(--m);font-size:13px;white-space:nowrap}
.muted{color:var(--m);font-size:14px}.help{background:#FFF8E5;border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.hint{color:#B9770E;font-size:14px;font-weight:600;margin-top:4px}
.chrono{font-size:44px;font-weight:800;text-align:center;color:var(--g);font-variant-numeric:tabular-nums;margin:6px 0}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb td,.tb th{border-bottom:1px solid #EEE;padding:6px;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;z-index:30;max-width:90%;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--r)}
</style>
</head>
<body>
<header>
 <div class="top"><b>EIE Ouvéa</b><span id="st"></span></div>
 <nav class="tabs">
  <button data-t="plantes">Plantes</button><button data-t="reptiles">Reptiles</button><button data-t="fourmis">Fourmis</button><button data-t="oiseaux">Oiseaux</button><button data-t="donnees">Données</button>
 </nav>
</header>
<main id="view"></main>
<div id="dls"></div>
<div id="toast"></div>
<script>window.APPV='1.0.0';</script>
<script src="prot.js"></script>
<script src="app.js"></script>
</body>
</html>
